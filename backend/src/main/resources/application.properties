spring.application.name=reliefsync-backend

server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/reliefsync}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.pool-name=ReliefSyncHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:10}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.jwt.secret=${JWT_SECRET:cmVsaWVmc3luYy1jaGFuZ2UtdGhpcy10by1hLXNlY3VyZS1iYXNlNjQtc2VjcmV0LWtleS1mb3ItcHJvZHVjdGlvbg==}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.ai.openai.enabled=${AI_ENABLED:true}
app.ai.openai.api-key=${AI_API_KEY:}
app.ai.openai.base-url=${AI_BASE_URL:https://api.openai.com}
app.ai.openai.model=${AI_MODEL:gpt-4o-mini}
app.ai.openai.timeout-ms=${AI_TIMEOUT_MS:5000}

logging.level.org.springframework.security=INFO
logging.level.com.reliefsync.backend=INFO

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost,http://127.0.0.1:5173}

springdoc.swagger-ui.path=/swagger-ui.html
